<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://pvqnkamqtgjvoihpuzoc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_okJu8VwvSTa6KGhLZKR5EA_RBZt3bk3';

    // ہم نے نام بدل کر mySupabase رکھ دیا ہے تاکہ پرانے نام سے ٹکراؤ نہ ہو
    const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('registerForm');
        
        if (registerForm) {
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault(); // پیج کو ریفریش ہونے سے روکنے کے لیے

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const { data, error } = await mySupabase.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    alert('اکاؤنٹ کامیابی سے بن گیا ہے!');
                    window.location.href = 'login.html';

                } catch (err) {
                    alert('خرابی: ' + err.message);
                }
            });
        }
    });
</script>
